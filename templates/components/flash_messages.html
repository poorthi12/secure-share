{% if flash_messages %}<div class="flash-stack" role="status">{% for item in flash_messages %}<div class="flash flash-{{ item.kind }}"><span class="flash-icon">{% if item.kind == 'error' %}×{% elif item.kind == 'success' %}✓{% else %}i{% endif %}</span><span>{{ item.message }}</span><button type="button" class="flash-close" aria-label="Dismiss message" data-dismiss>×</button></div>{% endfor %}</div>{% endif %}
