[project]
name = "secureshare"
version = "1.0.0"
description = "Secure file sharing and collaboration for students"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "argon2-cffi>=25.1.0",
  "cloudinary>=1.44.1",
  "cryptography>=45.0.0",
  "email-validator>=2.2.0",
  "fastapi>=0.116.0",
  "httpx>=0.28.1",
  "itsdangerous>=2.2.0",
  "jinja2>=3.1.6",
  "pydantic-settings>=2.10.0",
  "pymongo>=4.13.0",
  "python-multipart>=0.0.20",
  "uvicorn[standard]>=0.35.0",
]

[build-system]
requires = ["setuptools>=75.0.0"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = ["pytest>=8.4.0", "pytest-asyncio>=1.1.0"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.vercel]
framework = "fastapi"
entrypoint = "main:app"

[tool.vercel.fastapi.static]
cdn = false

[tool.setuptools.packages.find]
include = ["app*"]
